<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docx Viewer Installed</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
  <h1 class="page__title">Docx Viewer Installed</h1>

  <section class="step">
    <p class="step__text">
      Click the puzzle (1) piece in the top right of your browser.
      Then, click the little pin (2) next to the extension:
    </p>
    <figure class="step__figure">
      <img
        class="step__image"
        src="images/step-pin-extension.png"
        alt="Chrome toolbar with the Extensions menu open"
        width="1521" height="615" decoding="async">
    </figure>
  </section>

  <section class="step">
    <p class="step__text">
      Open the extension (3) on any page to start using Docx Viewer:
    </p>
    <figure class="step__figure">
      <img
        class="step__image"
        src="images/step-open-extension.png"
        alt="Chrome toolbar with the Docx Viewer icon pinned"
        width="1521" height="615" decoding="async" loading="lazy">
    </figure>
  </section>
</main>

</body>
</html>
